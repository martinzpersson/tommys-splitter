name: Build Tommy's Splitter APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
    
    - name: Install Python dependencies
      run: |
        pip install buildozer cython kivy PyPDF2
    
    - name: Build APK
      run: |
        buildozer android debug
      working-directory: ./android_app
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: tommyssplitter-apk
        path: android_app/bin/*.apk
